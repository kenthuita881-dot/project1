<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Part 1: Page structure -->
  <h1>My Budget Tracker</h1>
  <p class="subtitle">Track your income and expenses in one place.</p>

  <!-- Part 2: Add Expense section -->
  <section id="add-expense" class="card">
    <h2>Add Expense</h2>

    <label for="expense-name">Expense name</label>
    <input type="text" id="expense-name" placeholder="e.g. Lunch">

    <label for="expense-amount">Amount</label>
    <input type="number" id="expense-amount" placeholder="e.g. 250">

    <label for="expense-category">Category</label>
    <input type="text" id="expense-category" placeholder="e.g. Food">
  </section>

  <!-- Part 3: Your Expenses placeholder -->
  <section id="expenses-list" class="card">
    <h2>Your Expenses</h2>
    <p class="placeholder">No expenses yet</p>
  </section>

</body>
</html>
